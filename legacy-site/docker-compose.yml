# Riverbend Regional Commission (Demo) - the "inherited legacy" WordPress site.
# Local only: every port is bound to 127.0.0.1.
services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: rootpass
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on: [db]
    ports:
      - "127.0.0.1:8080:80"
    environment: &wp-env
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins

  # One-shot WP-CLI container: docker compose run --rm wpcli <command>
  wpcli:
    image: wordpress:cli-php8.3
    profiles: [tools]
    user: "33:33" # match www-data in the Apache image so file ownership lines up
    depends_on: [db, wordpress]
    environment:
      <<: *wp-env
      HOME: /tmp
    volumes:
      - wp_data:/var/www/html
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./assets:/assets:ro
      - ./scripts:/scripts:ro

volumes:
  db_data:
  wp_data:
